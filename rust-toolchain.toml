# The Rust version of every build: CI, e2e tests, release and local
# development. rustup installs it with these components and targets.
# Dependabot proposes updates (.github/dependabot.yml).
[toolchain]
channel = "1.100.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = ["x86_64-unknown-linux-musl"]
