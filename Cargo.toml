[workspace]
resolver = "3"
members = ["crates/*"]
# Everything but crates/xtask, the release tool that builds the Debian
# package. A cargo build without -p or --workspace, as for the
# release binary, does not build it, so its dependencies cannot change the
# features of a dependency of parity.
default-members = ["crates/parity", "crates/parity-analyze", "crates/parity-collect", "crates/parity-proto"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/veedel-oss/parity"
# Released as static binaries on GitHub, not on crates.io (see docs/architecture.md).
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
