[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/veedel-oss/parity"
# Released as static binaries on GitHub, not on crates.io (see docs/architecture.md).
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
