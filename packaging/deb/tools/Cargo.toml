# Never built. Holds the version of cargo-deb that the release installs
# (.github/workflows/release.yml), so that Dependabot proposes updates of it
# (.github/dependabot.yml). cargo install --locked builds cargo-deb with the
# Cargo.lock published with that version, so the version also fixes all of
# its dependencies. No Cargo.lock here: nothing is resolved or built.
[package]
name = "parity-release-tools"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
path = "lib.rs"

[dependencies]
# Always an exact version: the release refuses anything else.
cargo-deb = "=3.8.0"

# A workspace of its own, not a member of the one at the root.
[workspace]
