<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Parity logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2335"/>
      <stop offset="1" stop-color="#0d121c"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- equals sign: two machines, identical state -->
  <g>
    <rect x="42" y="52" width="82" height="30" rx="15" fill="url(#teal)"/>
    <rect x="132" y="52" width="82" height="30" rx="15" fill="url(#violet)"/>
    <rect x="42" y="96" width="82" height="30" rx="15" fill="url(#teal)"/>
    <rect x="132" y="96" width="82" height="30" rx="15" fill="url(#violet)"/>
  </g>

  <text x="128" y="190" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="1">
    <tspan fill="#ffffff">par</tspan><tspan fill="#5eead4">ity</tspan>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
