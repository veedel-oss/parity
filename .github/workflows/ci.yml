name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings fail the build. 
  # Cargo 1.85 (the minimum supported version) ignores this setting. See build_minimum_rust_version
  CARGO_BUILD_WARNINGS: deny

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        # The version, components and targets from rust-toolchain.toml.
        run: rustup toolchain install
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: check crate boundaries
        run: |
          for pair in "parity-collect parity-analyze" "parity-analyze parity-collect"; do
            set -- $pair
            deps=$(cargo tree --locked -p "$1" -e normal,build,dev --prefix none)
            if grep -q "^$2 " <<< "$deps"; then
              echo "::error::$1 must not depend on $2"
              exit 1
            fi
          done
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked

  build_minimum_rust_version:
    name: build with minimum supported Rust version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.85
        run: rustup toolchain install 1.85 --profile minimal
      - name: cargo build
        # +1.85 overrides rust-toolchain.toml.
        run: cargo +1.85 build --workspace --all-targets --locked

  build_static:
    name: build static ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # Only the released architecture. The matrix keeps the job name, which
        # is a required status check.
        target: [x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        # The version and targets from rust-toolchain.toml.
        run: rustup toolchain install
      - name: cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: check static linking and size
        run: |
          bin=target/${{ matrix.target }}/release/parity
          file "$bin"
          file "$bin" | grep -q 'statically linked\|static-pie linked'
          size=$(stat -c %s "$bin")
          echo "size: $size bytes"
          test "$size" -lt 5000000
      - name: run on this runner
        run: target/${{ matrix.target }}/release/parity --version
