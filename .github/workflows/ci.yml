name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: crate boundaries
        run: |
          for pair in "parity-collect parity-analyze" "parity-analyze parity-collect"; do
            set -- $pair
            deps=$(cargo tree --locked -p "$1" -e normal,build,dev --prefix none)
            if grep -q "^$2 " <<< "$deps"; then
              echo "::error::$1 must not depend on $2"
              exit 1
            fi
          done
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked

  msrv:
    name: build with minimum supported Rust version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
