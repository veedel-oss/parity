name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny

jobs:
  check_bash:
    name: shellcheck
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck

  check_python:
    name: ruff
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: "**/*.py"
          args: check
      - name: ruff format
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          src: "**/*.py"
          args: format --check

  check_docker:
    name: hadolint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          recursive: true
          config: .hadolint.yaml

  check_rust:
    name: fmt, clippy, build, test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        # The version, components and targets from rust-toolchain.toml.
        run: rustup toolchain install
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: check crate boundaries
        run: |
          for pair in "parity-collect parity-analyze" "parity-analyze parity-collect"; do
            set -- $pair
            deps=$(cargo tree --locked -p "$1" -e normal,build,dev --prefix none)
            if grep -q "^$2 " <<< "$deps"; then
              echo "::error::$1 must not depend on $2"
              exit 1
            fi
          done
      - name: check the copyright file of the Debian package
        # Crates of this workspace have a path in parentheses.
        run: |
          linked=$(cargo tree --locked -p parity --target x86_64-unknown-linux-musl \
              -e normal,no-proc-macro --prefix none --format '{p}' |
            grep -v ' (/' | awk '{ print $1 }' | sort -u)
          listed=$(sed -n 's|^Files: vendor/\([^/]*\)/\*$|\1|p' packaging/deb/copyright | sort -u)
          if [ "$linked" != "$listed" ]; then
            echo "::error::packaging/deb/copyright does not list the linked crates (< linked, > listed)"
            diff <(echo "$linked") <(echo "$listed")
            exit 1
          fi
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked

  build_static:
    name: build static ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        # Only the released architecture. The matrix keeps the job name, which
        # is a required status check.
        target: [x86_64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        # The version and targets from rust-toolchain.toml.
        run: rustup toolchain install
      - name: cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: check static linking and size
        run: |
          bin=target/${{ matrix.target }}/release/parity
          file "$bin"
          file "$bin" | grep -q 'statically linked\|static-pie linked'
          size=$(stat -c %s "$bin")
          echo "size: $size bytes"
          test "$size" -lt 5000000
      - name: run on this runner
        run: target/${{ matrix.target }}/release/parity --version
