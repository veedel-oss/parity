name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, build, test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: check crate boundaries
        run: |
          for pair in "parity-collect parity-analyze" "parity-analyze parity-collect"; do
            set -- $pair
            deps=$(cargo tree --locked -p "$1" -e normal,build,dev --prefix none)
            if grep -q "^$2 " <<< "$deps"; then
              echo "::error::$1 must not depend on $2"
              exit 1
            fi
          done
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked

  build_minimum_rust_version:
    name: build with minimum supported Rust version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85
      - name: cargo build
        run: cargo build --workspace --all-targets --locked

  build_static:
    name: build static ${{ matrix.target }}
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      # No C code is linked, so the linker shipped with Rust is enough for every musl target.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: cargo build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: check static linking and size
        run: |
          bin=target/${{ matrix.target }}/release/parity
          file "$bin"
          file "$bin" | grep -q 'statically linked\|static-pie linked'
          size=$(stat -c %s "$bin")
          echo "size: $size bytes"
          test "$size" -lt 5000000
      - name: run on this runner
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: target/${{ matrix.target }}/release/parity --version

  vm:
    name: system tests ${{ matrix.os }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [debian-10, debian-11, debian-12, debian-13]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The cache key changes when a new image is published.
      - name: Image version
        id: image
        run: |
          . tests/vm/images.sh
          url=$(image_url ${{ matrix.os }})
          modified=$(curl -fsSIL "$url" | tr -d '\r' | sed -n 's/^last-modified: //Ip' | tail -1)
          echo "version=$(echo "$url $modified" | sha256sum | cut -c1-16)" >>"$GITHUB_OUTPUT"
      - name: Cache image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/parity-vm
          key: parity-vm-${{ matrix.os }}-${{ steps.image.outputs.version }}
      - name: run
        run: tests/vm/run.sh ${{ matrix.os }}
