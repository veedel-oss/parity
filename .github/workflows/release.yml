name: Release

# A draft release for a v* tag: docs/maintaining.md, Releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_WARNINGS: deny
  # Only the architecture the e2e tests run on is released.
  TARGET: x86_64-unknown-linux-musl

jobs:
  # Runs code of the dependencies: read access only, no credentials.
  build:
    name: build the release binary and the Debian package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # The toolchain of rust-toolchain.toml.
        run: rustup toolchain install
      - name: cargo build
        run: cargo build --release --locked --target "$TARGET"
      - name: check the binary against the tag
        run: |
          bin=target/$TARGET/release/parity
          file "$bin" | grep -q 'statically linked\|static-pie linked'
          version=${GITHUB_REF_NAME#v}
          if [ "$("$bin" --version)" != "parity $version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match $("$bin" --version)"
            exit 1
          fi
          mkdir dist
          cp "$bin" "dist/parity-$version-$TARGET"
      - name: check the changelog against the tag
        # The tagged commit must have dropped "(unreleased)" from the heading.
        run: |
          heading="## ${GITHUB_REF_NAME#v}"
          if ! grep -qxF "$heading" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no heading '$heading' (a section marked unreleased does not count)"
            exit 1
          fi
      - name: build the Debian package
        run: packaging/deb/build.sh "dist/parity-${GITHUB_REF_NAME#v}-$TARGET" dist
      - name: check the package against the tag and the binary
        run: |
          version=${GITHUB_REF_NAME#v}
          deb=dist/parity_${version}_amd64.deb
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          if [ "$(dpkg-deb --field "$deb" Version)" != "$version" ]; then
            echo "::error::package version $(dpkg-deb --field "$deb" Version) does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          # xz for old dpkg (packaging/deb/build.sh).
          ar t "$deb" | grep -qx data.tar.xz
          # The package holds exactly the binary that is released on its own.
          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/bin/parity | cmp - "dist/parity-$version-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error
          # Long enough for the approval of the release job.
          retention-days: 7

  # Runs no code of the project; starts only after approval.
  release:
    name: attest and create the draft release
    needs: build
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      # Create the release.
      contents: write
      # Sigstore certificate, attestation and its storage record.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: checksums and release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          echo "VERSION=$version" >> "$GITHUB_ENV"
          (cd dist && sha256sum "parity-$version-$TARGET" "parity_${version}_amd64.deb" > SHA256SUMS)
          # The section below the heading "## <version>", up to the next heading.
          awk -v h="## $version" '$0 == h { on = 1; next } /^## / { on = 0 } on' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/parity-${{ env.VERSION }}-${{ env.TARGET }}
            dist/parity_${{ env.VERSION }}_amd64.deb
      - name: create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "v$VERSION" --verify-tag --draft --title "$VERSION" \
            --notes-file notes.md "dist/parity-$VERSION-$TARGET" \
            "dist/parity_${VERSION}_amd64.deb" dist/SHA256SUMS
