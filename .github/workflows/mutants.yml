# Mutation testing, once a week: docs/maintaining.md, Mutation testing.
name: mutants

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        # The toolchain of rust-toolchain.toml.
        run: rustup toolchain install
      - name: cargo mutants
        run: make mutants JOBS="$(nproc)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants.out
          path: target/mutants.out
          if-no-files-found: ignore
