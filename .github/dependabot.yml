version: 2
updates:
  # Actions are pinned to commit SHAs in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Wait before proposing a new release, so a compromised or yanked
    # release is caught before it reaches a PR. Security updates are exempt.
    # github-actions supports only default-days, not the semver-* keys.
    cooldown:
      default-days: 7

  # The Rust version in rust-toolchain.toml.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 14
      semver-major-days: 30

  # The base image of the e2e test container (tests/e2e/Dockerfile), pinned
  # by digest. The tag is a codename, so only the digest is updated.
  # Docker supports only default-days of the cooldown.
  - package-ecosystem: docker
    directory: /tests/e2e
    schedule:
      interval: daily
    cooldown:
      default-days: 7

  # The base image of the container that builds the Debian package locally
  # (packaging/deb/Dockerfile, make build-deb), pinned by digest like the
  # one above.
  - package-ecosystem: docker
    directory: /packaging/deb
    schedule:
      interval: daily
    cooldown:
      default-days: 7
