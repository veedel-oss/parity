[package]
name = "parity-analyze"
description = "CLI side of Parity: SSH, privilege escalation, comparison, reports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[dependencies]
parity-proto = { path = "../parity-proto" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
# Random nonces that authenticate the attach to the protocol session.
rand = { version = "0.10", default-features = false, features = ["std_rng", "sys_rng"] }
