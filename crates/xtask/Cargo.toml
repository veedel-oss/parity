[package]
name = "xtask"
description = "Release tool of Parity: builds the Debian package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


# Never shipped and not linked into parity. Not a default member of the
# workspace (Cargo.toml), so that a plain cargo build does not build it and
# its dependencies never change the features of a dependency of parity.
[dependencies]
# The completions of the package, from parity completion's own function.
parity-analyze = { path = "../parity-analyze" }
