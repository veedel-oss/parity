[package]
name = "xtask"
description = "Release tool of Parity: generates the man pages and shell completions of the Debian package"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


# Never shipped and not linked into parity. Not a default member of the
# workspace (Cargo.toml), so that a plain cargo build does not build it and
# its features of clap never reach the parity binary.
[dependencies]
parity-analyze = { path = "../parity-analyze" }
clap = "4.5"
clap_complete = "4.6"
clap_mangen = "0.3"
