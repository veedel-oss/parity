[package]
name = "parity-collect"
description = "Collect mode of Parity: runs as root on the target, read-only"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


# Every dependency here runs as root on the target. Each needs a reason.
[dependencies]
# Shared protocol types.
parity-proto = { path = "../parity-proto" }
# System calls not in std: openat, fstatat, readlinkat, readdir, poll,
# seteuid, fork, with the exact flags collect mode needs (O_NOATIME,
# O_NOFOLLOW).
libc = "0.2"
# SHA-256 of file contents. A well-known, maintained implementation instead
# of one of our own; it uses the CPU's SHA instructions where present.
sha2 = { version = "0.11", default-features = false }
