[package]
name = "parity-collect"
description = "Collect mode of Parity: runs as root on the target, read-only"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


# Every dependency runs as root on the target and needs a reason (AGENTS.md).
[dependencies]
parity-proto = { path = "../parity-proto" }
# System calls and flags std does not offer (O_NOATIME, O_PATH, O_NOFOLLOW).
libc = "0.2"
# XXH3-128 of file contents, without dependencies (docs/architecture.md,
# Comparison).
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }

[dev-dependencies]
# For #[cfg_attr(test, mutants::skip)]: docs/maintaining.md, Mutation testing.
mutants = "0.0.4"
