[package]
name = "parity"
description = "Compare two Linux machines and show where they differ"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true


[dependencies]
parity-collect = { path = "../parity-collect" }
parity-analyze = { path = "../parity-analyze" }

# The Debian package parity_<version>_amd64.deb. cargo-deb builds it in the
# release only (.github/workflows/release.yml), from the static binary that
# was built before and that CI and the e2e tests tested:
#
#   cargo deb -p parity --target x86_64-unknown-linux-musl --no-build --no-strip
#
# See docs/architecture.md, Builds.
[package.metadata.deb]
maintainer = "veedel-oss <veedel-oss@mailbox.org>"
# Installed as /usr/share/doc/parity/copyright, as it is.
license-file = ["../../packaging/deb/copyright", "0"]
section = "admin"
priority = "optional"
# The version of the release as it is, without a Debian revision: releases
# are immutable, so a rebuilt package is a new release anyway.
revision = ""
# None, the binary is static. No recommends either: the workstation needs an
# ssh client, a target an SSH server and sudo or su, and one package for both
# roles cannot say which.
depends = ""
extended-description = """\
Parity compares two Linux machines over SSH and shows where they differ: \
installed Debian packages, configuration directories such as /etc including \
the content of the files, and the whole file system.

The same static binary is the CLI on the workstation and the collector on \
each target, which the CLI starts over SSH with sudo or su for one run. The \
collector only reads: Parity never changes the systems it inspects."""
# No maintainer scripts, conffiles or services: installing the package
# configures nothing, and removing it leaves nothing behind. cargo-deb
# compresses the changelog and the man pages. The man pages and completions
# are generated before, with cargo run -p xtask -- gen-docs packaging/deb/generated.
assets = [
  ["target/release/parity", "usr/bin/", "755"],
  ["../../CHANGELOG.md", "usr/share/doc/parity/changelog", "644"],
  ["../../packaging/deb/generated/man/*.1", "usr/share/man/man1/", "644"],
  ["../../packaging/deb/generated/completions/parity.bash", "usr/share/bash-completion/completions/parity", "644"],
  ["../../packaging/deb/generated/completions/_parity", "usr/share/zsh/vendor-completions/", "644"],
  ["../../packaging/deb/generated/completions/parity.fish", "usr/share/fish/vendor_completions.d/", "644"],
]
